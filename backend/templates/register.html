{% extends "base.html" %}
{% block title %}Registro — VAN{% endblock %}
{% block content %}
<div class="auth-page page-transition">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/static/logo.png" alt="VAN" style="height:48px;margin-bottom:8px;">
      <h1>VAN</h1>
      <p>Crear cuenta de pasajero</p>
    </div>

    <form class="form" method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="input-group">
        <label>Nombre completo</label>
        <input type="text" name="name" required placeholder="Tu nombre">
      </div>
      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" required placeholder="tu@correo.com">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" name="password" required placeholder="••••••••" minlength="6">
      </div>
      <div class="input-group">
        <label>Teléfono (opcional)</label>
        <input type="tel" name="phone" placeholder="+54 11 1234 5678">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Crear cuenta</button>
    </form>

    <div class="links-row">
      <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
      <a href="/driver/register">¿Eres conductor? Regístrate aquí</a>
    </div>
  </div>
</div>
{% endblock %}
