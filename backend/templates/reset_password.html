{% extends "base.html" %}
{% block title %}Restablecer contraseña — VAN{% endblock %}
{% block content %}
<div class="auth-page page-transition">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/static/logo.png" alt="VAN">
      <h1>VAN</h1>
      <p>Restablecer contraseña</p>
    </div>

    <form class="form" method="post" action="/reset-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="input-group">
        <label>Código de verificación</label>
        <input type="text" name="code" required placeholder="123456" style="text-align:center;font-size:1.5rem;letter-spacing:8px;font-weight:700;" maxlength="6" autocomplete="off">
      </div>
      <div class="input-group">
        <label>Nueva contraseña</label>
        <input type="password" name="new_password" required placeholder="••••••••">
      </div>
      <div class="input-group">
        <label>Confirmar contraseña</label>
        <input type="password" name="confirm_password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Restablecer contraseña</button>
    </form>

    <div class="links-row">
      <a href="/login">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
{% endblock %}
