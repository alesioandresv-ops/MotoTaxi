{% extends "base.html" %}
{% block content %}
<style>
  .historial-page { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; position: relative; z-index: 1; }
  .historial-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .historial-header h1 { font-size: 1.4rem; font-weight: 700; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { padding: 8px 18px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); color: var(--text-secondary); background: transparent; transition: all var(--transition); }
  .filter-btn:hover { border-color: var(--primary); color: var(--primary-light); }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .search-bar { position: relative; margin-bottom: 20px; }
  .search-bar input { width: 100%; padding: 12px 16px 12px 44px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.9rem; outline: none; transition: all var(--transition); }
  .search-bar input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--primary-glow); }
  .search-bar .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; pointer-events: none; }
  .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; transition: all var(--transition); }
  .history-card:hover { border-color: rgba(148, 163, 184, 0.2); }
  .history-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .history-route { font-size: 0.95rem; font-weight: 600; line-height: 1.4; }
  .history-route .arrow { color: var(--text-muted); margin: 0 6px; }
  .history-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px; }
  .history-meta span { display: flex; align-items: center; gap: 4px; }
  .history-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  .history-fare { font-size: 1.1rem; font-weight: 800; color: var(--primary-light); }
  .stars { display: inline-flex; gap: 2px; }
  .stars .star { color: var(--text-muted); font-size: 1.1rem; cursor: default; }
  .stars .star.filled { color: #fbbf24; }
  .stars .star.clickable { cursor: pointer; transition: transform var(--transition); }
  .stars .star.clickable:hover { transform: scale(1.2); }
  .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .page-btn { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); color: var(--text-secondary); background: transparent; transition: all var(--transition); min-width: 40px; text-align: center; }
  .page-btn:hover { border-color: var(--primary); color: var(--primary-light); }
  .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .page-btn.disabled { opacity: 0.3; pointer-events: none; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  .spinner-sm { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 480px) { .historial-page { padding: 16px 12px 80px; } .history-card { padding: 14px 16px; } }
</style>

<div class="historial-page">
  <div class="historial-header">
    <a href="{{ url_for('main.dashboard') }}" class="btn-ghost-sm" style="padding:8px 12px;">← Volver</a>
    <h1>Historial de Viajes</h1>
  </div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Buscar por dirección de origen o destino..." oninput="debounceSearch()">
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-status="" onclick="setFilter(this)">Todos</button>
    <button class="filter-btn" data-status="completed" onclick="setFilter(this)">Completados</button>
    <button class="filter-btn" data-status="cancelled" onclick="setFilter(this)">Cancelados</button>
  </div>

  <div id="history-list"><div class="loading"><span class="spinner-sm"></span>Cargando historial...</div></div>
  <div id="pagination" class="pagination"></div>
</div>

<script>
var CSRF_TOKEN = window.CSRF_TOKEN || '{{ csrf_token }}';
var currentPage = 1;
var currentStatus = '';
var searchTimeout;

function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(function () { currentPage = 1; loadHistory(); }, 300);
}

function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  currentStatus = btn.getAttribute('data-status') || '';
  currentPage = 1;
  loadHistory();
}

function loadHistory() {
  var list = document.getElementById('history-list');
  list.innerHTML = '<div class="loading"><span class="spinner-sm"></span>Cargando historial...</div>';
  document.getElementById('pagination').innerHTML = '';

  var q = document.getElementById('search-input').value.trim();
  var url = '/api/trips/history?page=' + currentPage + '&limit=20';
  if (currentStatus) url += '&status=' + currentStatus;
  if (q) url += '&q=' + encodeURIComponent(q);

  fetch(url, { headers: { 'X-CSRF-Token': CSRF_TOKEN } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      renderTrips(data);
      renderPagination(data);
    })
    .catch(function () {
      list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Error al cargar el historial</p></div>';
    });
}

function renderTrips(data) {
  var list = document.getElementById('history-list');
  if (!data.trips || data.trips.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🛵</div><p>No hay viajes en tu historial</p></div>';
    return;
  }

  var html = '';
  data.trips.forEach(function (t) {
    var badgeClass = 'badge-' + t.status;
    var statusLabel = { completed: 'Completado', cancelled: 'Cancelado' }[t.status] || t.status;

    var starsHtml = '';
    var requestAgainHtml = '';
    if (t.status === 'completed') {
      if (t.my_rating) {
        for (var i = 1; i <= 5; i++) {
          starsHtml += '<span class="star' + (i <= t.my_rating ? ' filled' : '') + '">★</span>';
        }
      } else {
        starsHtml = '<button class="btn-ghost-sm" onclick="rateTripFromHistory(' + t.id + ')">⭐ Calificar</button>';
      }
      requestAgainHtml = '<button class="btn-ghost-sm" onclick="solicitarDeNuevo(\'' + escapeJs(t.pickup_address) + '\',\'' + escapeJs(t.dropoff_address) + '\',\'' + t.vehicle_type + '\',\'' + (t.payment_method || 'efectivo') + '\')">🔄 Solicitar de nuevo</button>';
    }

    html += '<div class="history-card">' +
      '<div class="history-card-header">' +
        '<div class="history-route">📍 ' + escapeHtml(t.pickup_address) + ' <span class="arrow">→</span> 📍 ' + escapeHtml(t.dropoff_address) + '</div>' +
        '<span class="badge ' + badgeClass + '">' + statusLabel + '</span>' +
      '</div>' +
      '<div class="history-meta">' +
        '<span>📅 ' + formatDate(t.requested_at) + '</span>' +
        (t.duration_min ? '<span>⏱ ' + t.duration_min + ' min</span>' : '') +
        (t.distance_km ? '<span>📏 ' + t.distance_km.toFixed(1) + ' km</span>' : '') +
        '<span>💳 ' + (t.payment_method || '—') + '</span>' +
      '</div>' +
      (t.driver_name ? '<div class="history-meta" style="margin-bottom:0;">👤 ' + escapeHtml(t.driver_name) + (t.driver_vehicle ? ' · ' + t.driver_vehicle : '') + (t.driver_phone ? ' · ' + t.driver_phone : '') + '</div>' : '') +
      '<div class="history-footer">' +
        '<div class="history-fare">$' + t.fare.toFixed(2) + '</div>' +
        '<div style="display:flex;gap:6px;align-items:center;">' + starsHtml + requestAgainHtml + '</div>' +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;
}

function renderPagination(data) {
  var container = document.getElementById('pagination');
  if (data.pages <= 1) { container.innerHTML = ''; return; }

  var html = '';
  html += '<button class="page-btn' + (data.page <= 1 ? ' disabled' : '') + '" onclick="goToPage(' + (data.page - 1) + ')" ' + (data.page <= 1 ? 'disabled' : '') + '>‹</button>';

  for (var i = 1; i <= data.pages; i++) {
    if (i === data.page || i === 1 || i === data.pages || Math.abs(i - data.page) <= 2) {
      html += '<button class="page-btn' + (i === data.page ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
    } else if (html.slice(-8) !== '…</button>') {
      html += '<button class="page-btn disabled" disabled>…</button>';
    }
  }

  html += '<button class="page-btn' + (data.page >= data.pages ? ' disabled' : '') + '" onclick="goToPage(' + (data.page + 1) + ')" ' + (data.page >= data.pages ? 'disabled' : '') + '>›</button>';
  container.innerHTML = html;
}

function goToPage(page) {
  currentPage = page;
  loadHistory();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function formatDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  var day = String(d.getDate()).padStart(2, '0');
  var month = String(d.getMonth() + 1).padStart(2, '0');
  var year = d.getFullYear();
  var hours = String(d.getHours()).padStart(2, '0');
  var mins = String(d.getMinutes()).padStart(2, '0');
  return day + '/' + month + '/' + year + ' ' + hours + ':' + mins;
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function rateTripFromHistory(tripId) {
  var rating = prompt('Calificación (1-5):');
  if (!rating) return;
  rating = parseInt(rating);
  if (rating < 1 || rating > 5) { alert('La calificación debe ser entre 1 y 5'); return; }
  var comment = prompt('Comentario (opcional):');
  apiFetch('/api/trip/' + tripId + '/rate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rating: rating, comment: comment || '' })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (data.success) { loadHistory(); }
    else { alert(data.error || 'Error al calificar'); }
  });
}

loadHistory();

function escapeJs(str) {
  if (!str) return '';
  return str.replace(/'/g, "\\'").replace(/\n/g, '\\n');
}

function solicitarDeNuevo(pickup, dropoff, vehicle, paymentMethod) {
  apiFetch('/api/wallet/balance')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (paymentMethod === 'billetera' && (!data.balance || data.balance <= 0)) {
        if (!confirm('Usaste Billetera en este viaje pero no tienes saldo suficiente. ¿Solicitar de todas formas eligiendo otro método de pago?')) {
          return;
        }
      }
      window.location.href = '/request-ride?from=' + encodeURIComponent(pickup) + '&to=' + encodeURIComponent(dropoff) + '&vehicle=' + vehicle;
    });
}
</script>
{% endblock %}
