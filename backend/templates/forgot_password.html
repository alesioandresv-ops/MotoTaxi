{% extends "base.html" %}
{% block title %}Recuperar contraseña — VAN{% endblock %}
{% block content %}
<div class="auth-page page-transition">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/static/logo.png" alt="VAN">
      <h1>VAN</h1>
      <p>Recuperar contraseña</p>
    </div>

    <form class="form" method="post" action="/forgot-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" required placeholder="tu@correo.com">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Enviar código de recuperación</button>
    </form>

    <div class="links-row">
      <a href="/login">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
{% endblock %}
