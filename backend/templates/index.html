{% extends "base.html" %}
{% block title %}VAN — Tu Aplicación de Transporte{% endblock %}
{% block content %}
<div class="auth-page page-transition">
  <div class="auth-card" style="text-align:center;">
      <div class="auth-logo">
        <img src="/static/logo.png" alt="VAN">
        <h1>VAN</h1>
        <p>Tu aplicación de transporte confiable</p>
      </div>
      <div style="display:grid;gap:14px;margin-top:24px;">
        <a href="/login" class="btn btn-primary btn-lg btn-block">Iniciar sesión</a>
        <a href="/register" class="btn btn-outline btn-block">Registrarse como pasajero</a>
        <a href="/driver/register" class="btn btn-outline btn-block">Registrarse como conductor</a>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:24px 0;">
      <div style="text-align:center;">
        <a href="/company" class="btn btn-outline btn-block" style="justify-content:center;">
          🏢 VAN para Empresas
        </a>
      </div>
    </div>
</div>
{% endblock %}
