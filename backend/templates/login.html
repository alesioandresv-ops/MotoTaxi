{% extends "base.html" %}
{% block title %}Iniciar sesión — VAN{% endblock %}
{% block content %}
<div class="auth-page page-transition">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/static/logo.png" alt="VAN" style="height:48px;margin-bottom:8px;">
      <h1>VAN</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <form class="form" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" required placeholder="tu@correo.com">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Iniciar sesión</button>
    </form>

    <div class="links-row">
      <a href="/register">¿No tienes cuenta? Regístrate</a>
      <a href="/driver/register">Regístrate como conductor</a>
      <hr class="divider">
      <a href="/company" class="muted">🏢 VAN para Empresas</a>
    </div>

    <div class="demo-section">
      <p>Acceso rápido de demostración</p>
      <div class="demo-buttons">
        <form method="post" action="/login" id="demo-passenger-form" style="flex:1;">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="email" value="pasajero@demo.com">
          <input type="hidden" name="password" value="1234">
        </form>
        <button type="button" class="demo-btn passenger" onclick="document.getElementById('demo-passenger-form').submit()">👤 Demo Pasajero</button>

        <form method="post" action="/login" id="demo-driver-form" style="flex:1;">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="email" value="conductor@demo.com">
          <input type="hidden" name="password" value="1234">
        </form>
        <button type="button" class="demo-btn driver" onclick="document.getElementById('demo-driver-form').submit()">🏍️ Demo Conductor</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
