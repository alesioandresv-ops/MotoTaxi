{% extends "base.html" %}
{% block title %}Iniciar sesión — VAN{% endblock %}
{% block content %}
<div class="auth-page page-transition">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/static/logo.png" alt="VAN">
      <h1>VAN</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <form class="form" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" required placeholder="tu@correo.com">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <a href="/forgot-password" style="display:block;text-align:right;font-size:0.85rem;color:var(--primary-light);margin-bottom:16px;text-decoration:none;">¿Olvidaste tu contraseña?</a>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Iniciar sesión</button>
    </form>

    <div class="links-row">
      <a href="/register">¿No tienes cuenta? Regístrate</a>
      <a href="/driver/register">Regístrate como conductor</a>
      <hr class="divider">
      <a href="/company" class="muted">🏢 VAN para Empresas</a>
    </div>
  </div>
</div>
{% endblock %}
